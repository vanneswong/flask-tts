<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本转语音</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">文本转语音</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6 max-w-2xl mx-auto">
            <div class="mb-4">
                <label for="text" class="block text-gray-700 font-medium mb-2">输入文本</label>
                <textarea id="text" rows="5" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            
            <div class="mb-4">
                <label for="voice" class="block text-gray-700 font-medium mb-2">选择音色</label>
                <select id="voice" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for voice in voices %}
                    <option value="{{ loop.index0 }}">
                        {{ voice.name }}
                        {% if 'ZH-CN' in voice.id or 'zh' in voice.id|lower %}
                            🇨🇳 中文
                        {% elif 'EN-US' in voice.id or 'en' in voice.id|lower %}
                            🇺🇸 英文
                        {% else %}
                            ({{ voice.languages[0] if voice.languages else '未知语言' }})
                        {% endif %}
                    </option>
                    {% endfor %}
                </select>
                <p class="text-sm text-gray-500 mt-1">共 {{ voices|length }} 个可用音色</p>
            </div>
            
            <div class="flex flex-wrap gap-4 mb-6">
                <button id="convert" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md transition duration-200">
                    转换为语音
                </button>
                <button id="play" disabled class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-md transition duration-200 opacity-50 cursor-not-allowed">
                    播放
                </button>
                <a id="download" class="hidden bg-purple-500 hover:bg-purple-600 text-white font-medium py-2 px-4 rounded-md transition duration-200" download>
                    下载语音
                </a>
            </div>
            
            <audio id="audio" controls class="w-full hidden"></audio>
        </div>
    </div>
    
    <script>
        document.getElementById('convert').addEventListener('click', async () => {
            const text = document.getElementById('text').value;
            const voiceIndex = document.getElementById('voice').value;
            
            if (!text) {
                alert('请输入文本');
                return;
            }
            
            try {
                const response = await fetch('/api/speech', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        voice: voiceIndex
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    const audio = document.getElementById('audio');
                    audio.src = data.url;
                    audio.classList.remove('hidden');
                    
                    document.getElementById('play').disabled = false;
                    document.getElementById('play').classList.remove('opacity-50', 'cursor-not-allowed');
                    
                    const downloadLink = document.getElementById('download');
                    downloadLink.href = data.url;
                    downloadLink.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('转换失败，请重试');
            }
        });
        
        document.getElementById('play').addEventListener('click', () => {
            document.getElementById('audio').play();
        });
    </script>
</body>
</html>
