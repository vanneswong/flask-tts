<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本转语音 · Piper</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --radius: 16px;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
            --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 16px 14px;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            height: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header { text-align: center; margin-bottom: 18px; flex-shrink: 0; }
        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            margin-bottom: 16px;
        }
        .header-icon svg { width: 28px; height: 28px; fill: #fff; }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }
        .header p { font-size: 14px; color: var(--text-secondary); }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #4338ca;
            background: #eef2ff;
            border-radius: 20px;
        }

        /* 双栏布局：撑满剩余高度，各栏内部滚动，页面不因内容过长而变形 */
        .main-layout {
            display: grid;
            /* minmax(0,1fr) 避免轨道被内部固有宽度（如 textarea/不换行文本）撑破 */
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 20px;
            align-items: stretch;
            flex: 1;
            min-height: 0;
        }
        .col-left, .col-right {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
            min-width: 0;
        }

        /* Card */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 22px;
            border: 1px solid var(--border);
            min-height: 0;
        }

        /* 左栏表单卡片：撑满高度，文本框自适应 */
        .card-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .form-group-grow {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .form-group-grow .textarea {
            flex: 1;
            min-height: 96px;
            resize: none;
        }

        /* 右栏：预览固定高度，历史列表内部滚动 */
        .preview-card {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .card-history {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .title-count {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            background: #eef2ff;
            border-radius: 20px;
            padding: 2px 9px;
            text-transform: none;
            letter-spacing: 0;
        }
        .title-count:empty { display: none; }
        .title-main {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .title-main svg { width: 15px; height: 15px; flex-shrink: 0; }
        .badge svg { width: 13px; height: 13px; flex-shrink: 0; }

        /* Form */
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .form-label .hint {
            font-size: 11px;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
            color: #94a3b8;
        }

        .textarea {
            width: 100%;
            min-height: 140px;
            padding: 14px 16px;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            resize: vertical;
            transition: border-color .2s, box-shadow .2s;
            font-family: inherit;
        }
        .textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,.15);
        }
        .textarea::placeholder { color: #94a3b8; }

        .char-count {
            text-align: right;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .char-count.warn { color: #f59e0b; }
        .char-count.over { color: #ef4444; }

        /* Select */
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            border: 5px solid transparent;
            border-top: 5px solid var(--text-secondary);
        }
        .select {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text);
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            appearance: none;
            cursor: pointer;
            transition: border-color .2s, box-shadow .2s;
            font-family: inherit;
        }
        .select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,.15);
        }

        /* Speed */
        .speed-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--border);
            appearance: none;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,.2);
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid #fff;
        }
        .speed-value {
            min-width: 46px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            background: #eef2ff;
            border-radius: 8px;
            padding: 4px 8px;
        }

        /* Actions */
        .actions { display: flex; gap: 10px; margin-top: 24px; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
            text-decoration: none;
        }
        .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
        .btn-primary {
            flex: 1;
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
        .btn-download {
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: 1.5px solid var(--border);
            padding: 12px 16px;
            margin-top: 12px;
        }
        .btn-download:hover { border-color: var(--primary); color: var(--primary); }

        /* Preview */
        .preview-card audio {
            width: 100%;
            height: 40px;
            outline: none;
            border-radius: 8px;
        }
        .preview-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 10px;
            display: none;
        }
        .preview-meta.show { display: block; }
        .preview-empty {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            padding: 12px 0;
        }

        /* History */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding-right: 4px;
            margin-right: -4px;
        }
        /* 细滚动条 */
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .history-list::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .history-empty {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            padding: 24px 0;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: border-color .2s, background .2s, transform .2s;
        }
        .history-item:hover { border-color: var(--primary); background: #f8f9ff; transform: translateX(2px); }
        .history-item.active { border-color: var(--primary); background: #eef2ff; }
        .history-item .play-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            flex-shrink: 0;
        }
        .history-item .play-icon svg { width: 16px; height: 16px; }
        .history-item .item-info { flex: 1; min-width: 0; }
        .history-item .item-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item .item-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item .item-download {
            color: var(--text-secondary);
            flex-shrink: 0;
            display: inline-flex;
            padding: 6px;
            border-radius: 8px;
            transition: color .2s, background .2s;
        }
        .history-item .item-download:hover { color: var(--primary); background: rgba(99,102,241,.1); }
        .history-item .item-download svg { width: 16px; height: 16px; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            background: #1e293b;
            color: #fff;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: all .3s ease;
            z-index: 1000;
            max-width: calc(100vw - 32px);
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: #ef4444; }

        /* Footer */
        .footer {
            margin-top: 14px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
            flex-shrink: 0;
        }

        /* Spinner */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .6s linear infinite;
        }

        /* Responsive */
        @media (max-height: 720px) and (min-width: 901px) {
            .header p,
            .badge { display: none; }
            .header { margin-bottom: 12px; }
            .header-icon { width: 44px; height: 44px; border-radius: 13px; margin-bottom: 8px; }
            .header-icon svg { width: 22px; height: 22px; }
            .header h1 { font-size: 20px; }
        }
        @media (max-width: 900px) {
            /* 窄屏恢复自然文档流，整页滚动 */
            body {
                height: auto;
                min-height: 100dvh;
                overflow: auto;
                padding: 20px 16px;
            }
            .container { height: auto; }
            .main-layout { grid-template-columns: minmax(0, 1fr); }
            .card-form { min-height: 400px; }
            .card-history { min-height: 280px; }
            .history-list { max-height: 380px; }
        }
        @media (max-width: 480px) {
            body { padding: 16px 12px; }
            .card { padding: 18px 16px; }
            .header { margin-bottom: 18px; }
            .header h1 { font-size: 20px; }
            .actions { flex-direction: column; }
            .card-form { min-height: 380px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm-1 14.93A5.001 5.001 0 0 1 7 11h-1a6.001 6.001 0 0 0 5 5.91V20H8v2h8v-2h-3v-3.07A6.001 6.001 0 0 0 18 11h-1a5.001 5.001 0 0 1-4 4.93V15.93z"/></svg>
            </div>
            <h1>文本转语音</h1>
            <p>输入文字，即刻生成自然语音</p>
            <div class="badge">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
                Piper 神经网络语音引擎 · 完全离线
            </div>
        </div>

        <!-- 双栏主体 -->
        <div class="main-layout">
            <!-- 左栏：输入表单 -->
            <div class="col-left">
                <div class="card card-form">
                    <div class="form-group form-group-grow">
                        <label class="form-label" for="text">
                            <span>输入文本</span>
                            <span class="hint">支持中英文</span>
                        </label>
                        <textarea id="text" class="textarea"
                                  placeholder="请输入要转换的文字..."
                                  maxlength="{{ max_text_length }}"></textarea>
                        <div class="char-count" id="charCount">0 / {{ max_text_length }}</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="voice">
                            <span>选择音色</span>
                            <span class="hint" id="voiceCount">{{ voice_total }} 个可用</span>
                        </label>
                        <div class="select-wrapper">
                            <select id="voice" class="select">
                                {% for lang_name, group in voice_groups %}
                                <optgroup label="{{ lang_name }}">
                                    {% for voice in group %}
                                    <option value="{{ voice.id }}"
                                            data-sample-rate="{{ voice.sample_rate }}">
                                        {{ voice.name }}（{{ voice.quality_label }}）· {{ voice.language }}
                                    </option>
                                    {% endfor %}
                                </optgroup>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="speed">
                            <span>语速</span>
                            <span class="hint">0.5x – 2.0x</span>
                        </label>
                        <div class="speed-row">
                            <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
                            <span class="speed-value" id="speedValue">1.0x</span>
                        </div>
                    </div>

                    <div class="actions">
                        <button id="convert" class="btn btn-primary">
                            <svg id="btnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            <span id="btnText">转换为语音</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右栏：播放预览 + 历史列表 -->
            <div class="col-right">
                <div class="card preview-card">
                    <div class="section-title">
                        <span class="title-main">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
                            播放预览
                        </span>
                    </div>
                    <div id="previewEmpty" class="preview-empty">尚未生成语音，输入文字后点击转换</div>
                    <audio id="audio" controls style="display:none;"></audio>
                    <div class="preview-meta" id="previewMeta"></div>
                    <a id="download" class="btn btn-download" download style="display:none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        下载当前音频
                    </a>
                </div>

                <div class="card card-history">
                    <div class="section-title">
                        <span class="title-main">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
                            已生成的语音
                        </span>
                        <span class="title-count" id="historyCount"></span>
                    </div>
                    <div id="historyList" class="history-list">
                        <div class="history-empty">加载中...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            Powered by Piper · 神经网络离线合成 · v{{ version }}
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const $ = id => document.getElementById(id);
        const textEl = $('text');
        const charCountEl = $('charCount');
        const convertBtn = $('convert');
        const btnText = $('btnText');
        const downloadEl = $('download');
        const audioEl = $('audio');
        const previewEmptyEl = $('previewEmpty');
        const previewMetaEl = $('previewMeta');
        const historyListEl = $('historyList');
        const historyCountEl = $('historyCount');
        const toastEl = $('toast');
        const speedEl = $('speed');
        const speedValueEl = $('speedValue');
        const MAX_LEN = {{ max_text_length }};

        const ICON_PLAY = '<svg id="btnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
        const ICON_SPIN = '<div class="spinner" id="btnIcon"></div>';

        let currentItems = [];

        // 语速
        speedEl.addEventListener('input', () => {
            speedValueEl.textContent = Number(speedEl.value).toFixed(1) + 'x';
        });

        // 按钮加载状态：每次重新查询 DOM，避免 outerHTML 替换后引用失效
        function setBtnLoading(loading) {
            convertBtn.disabled = loading;
            btnText.textContent = loading ? '生成中...' : '转换为语音';
            const icon = $('btnIcon');
            if (icon) icon.outerHTML = loading ? ICON_SPIN : ICON_PLAY;
        }

        // 字符计数
        textEl.addEventListener('input', () => {
            const len = textEl.value.length;
            charCountEl.textContent = `${len} / ${MAX_LEN}`;
            charCountEl.className = 'char-count' + (len > MAX_LEN * 0.9 ? (len >= MAX_LEN ? ' over' : ' warn') : '');
        });

        function showToast(msg, isError = false) {
            toastEl.textContent = msg;
            toastEl.className = 'toast' + (isError ? ' error' : '');
            void toastEl.offsetWidth;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 3000);
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts * 1000);
            const diff = Math.floor((Date.now() - d) / 1000);
            if (diff < 60) return '刚刚';
            if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function formatSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
        }

        // 播放音频
        function playAudio(item) {
            audioEl.src = item.url;
            audioEl.style.display = 'block';
            previewEmptyEl.style.display = 'none';
            downloadEl.href = item.url;
            downloadEl.style.display = 'inline-flex';

            const parts = [];
            if (item.voice_name) parts.push(item.voice_name);
            if (item.speed && Number(item.speed) !== 1) parts.push(`语速 ${Number(item.speed).toFixed(1)}x`);
            previewMetaEl.textContent = parts.join(' · ');
            previewMetaEl.classList.toggle('show', parts.length > 0);

            audioEl.play().catch(() => {});

            document.querySelectorAll('.history-item').forEach(el => {
                const idx = parseInt(el.dataset.index, 10);
                el.classList.toggle('active', currentItems[idx] && currentItems[idx].url === item.url);
            });
        }

        function renderHistory(items) {
            currentItems = items || [];
            historyCountEl.textContent = currentItems.length ? `${currentItems.length} 条` : '';
            if (!currentItems.length) {
                historyListEl.innerHTML = '<div class="history-empty">暂无生成的语音</div>';
                return;
            }
            historyListEl.innerHTML = currentItems.map((item, idx) => {
                const text = escapeHtml(item.text || item.filename);
                const voiceName = item.voice_name ? item.voice_name.split('（')[0] : '';
                const speed = Number(item.speed || 1);
                const meta = [
                    voiceName,
                    speed !== 1 ? `${speed.toFixed(1)}x` : '',
                    formatTime(item.created_at),
                    formatSize(item.size)
                ].filter(Boolean).join(' · ');
                return `
                <div class="history-item" data-index="${idx}">
                    <span class="play-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </span>
                    <div class="item-info">
                        <div class="item-text">${text}</div>
                        <div class="item-meta">${escapeHtml(meta)}</div>
                    </div>
                    <a class="item-download" href="${item.url}" download title="下载">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </a>
                </div>`;
            }).join('');
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/audio');
                const data = await res.json();
                if (data.status === 'success') {
                    renderHistory(data.items || []);
                } else {
                    historyListEl.innerHTML = '<div class="history-empty">加载失败</div>';
                }
            } catch (err) {
                console.error('加载历史失败:', err);
                historyListEl.innerHTML = '<div class="history-empty">加载失败</div>';
            }
        }

        // 历史列表点击（事件委托）
        historyListEl.addEventListener('click', (e) => {
            if (e.target.closest('.item-download')) return;
            const itemEl = e.target.closest('.history-item');
            if (!itemEl) return;
            const item = currentItems[parseInt(itemEl.dataset.index, 10)];
            if (item) playAudio(item);
        });

        // 转换
        convertBtn.addEventListener('click', async () => {
            const text = textEl.value.trim();
            if (!text) {
                showToast('请输入要转换的文本', true);
                return;
            }

            setBtnLoading(true);
            try {
                const res = await fetch('/api/speech', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text,
                        voice: $('voice').value,
                        speed: Number(speedEl.value)
                    })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    await loadHistory();
                    const filename = data.url.split('/').pop();
                    const item = currentItems.find(it => it.filename === filename);
                    playAudio(item || {
                        url: data.url,
                        filename,
                        text,
                        voice_name: $('voice').selectedOptions[0]?.textContent?.trim() || '',
                        speed: Number(speedEl.value),
                        size: 0,
                        created_at: Date.now() / 1000
                    });
                    showToast(`语音生成成功${data.elapsed_ms ? `（${data.elapsed_ms} ms）` : ''}`);
                } else {
                    showToast(data.error || '转换失败，请重试', true);
                }
            } catch (err) {
                console.error('转换失败:', err);
                showToast('网络错误，请检查连接后重试', true);
            } finally {
                setBtnLoading(false);
            }
        });

        loadHistory();
    </script>
</body>
</html>
